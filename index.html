<section class="hero">
    <div class="container">
        <div class="hero_content grid">
            <img src="assests/img/heaeder-img.png" class="header_img">
            <div class="hero_detail">
                <h1 class="hero_text">We are <span>Beyond<br> Banking</span></h1>
                
                <!-- WALLET BANK -->
                <div class="wallet_card" style="background: linear-gradient(135deg, #00c575 0%, #00b368 100%); padding:24px; border-radius:16px; color:#fff; margin: 20px 0; max-width:400px; box-shadow: 0 10px 30px rgba(0,197,117,0.3);">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <p style="font-size:14px; opacity:0.9;"><i class="fa-solid fa-shield-halved"></i> Paycom Wallet • 100% Secure</p>
                        <i class="fa-regular fa-eye" id="toggleEye" style="cursor:pointer;"></i>
                    </div>
                    <h2 id="walletBalance" style="font-size:36px; margin:12px 0 18px; font-weight:800;">₦20,000.00</h2>
                    
                    <div style="display:flex; gap:10px;">
                        <button onclick="addFunds(20000)" style="flex:1; background:#fff; color:#00b368; border:none; padding:12px; border-radius:24px; font-weight:800; cursor:pointer;"><i class="fa-solid fa-plus"></i> Add Money</button>
                        <button onclick="openWithdraw()" style="flex:1; background:rgba(0,0,0,0.15); color:#fff; border:1px solid rgba(255,255,255,0.4); padding:12px; border-radius:24px; font-weight:700; cursor:pointer;"><i class="fa-solid fa-arrow-up-from-bracket"></i> Withdraw</button>
                    </div>

                    <!-- Mini transaction history -->
                    <div id="transactionList" style="margin-top:18px; background:rgba(255,255,255,0.15); border-radius:12px; padding:12px; max-height:120px; overflow-y:auto;">
                        <p style="font-size:12px; opacity:0.9;">Recent Transactions</p>
                        <div id="txs" style="font-size:13px; margin-top:6px;"></div>
                    </div>
                </div>

                <p class="hero_subtitle">OPay gives you the freedom to get more...</p>
            </div>
        </div>
    </div>
</section>

<!-- WITHDRAW MODAL -->
<div id="withdrawModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:#fff; width:90%; max-width:380px; border-radius:20px; padding:24px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="color:#000;">Withdraw to Bank</h3>
            <i class="fa-solid fa-xmark" onclick="closeWithdraw()" style="cursor:pointer; font-size:20px;"></i>
        </div>
        <p style="font-size:13px; color:#666; margin:8px 0;">Available: <span id="modalBalance" style="font-weight:700; color:#000;"></span></p>
        
        <label style="font-size:13px; font-weight:600;">Amount</label>
        <input id="withdrawAmount" type="number" placeholder="₦ Enter amount" style="width:100%; padding:14px; border-radius:10px; border:1px solid #ddd; margin:6px 0 14px; font-size:16px;">
        
        <label style="font-size:13px; font-weight:600;">Bank</label>
        <select style="width:100%; padding:14px; border-radius:10px; border:1px solid #ddd; margin:6px 0 20px;">
            <option>OPay - Free & Instant</option>
            <option>Access Bank</option>
            <option>GTBank</option>
            <option>First Bank</option>
            <option>UBA</option>
            <option>Kuda</option>
            <option>Moniepoint</option>
        </select>

        <button onclick="confirmWithdraw()" style="width:100%; background:#00b368; color:#fff; border:none; padding:14px; border-radius:12px; font-weight:800; font-size:16px; cursor:pointer;">Confirm Withdrawal</button>
        <p id="errorMsg" style="color:red; font-size:13px; text-align:center; margin-top:10px; display:none;"></p>
    </div>
</div>
